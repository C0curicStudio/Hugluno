<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-label="本地运行（网页版，只监听本机）"><style>text{font-family:"MaxRIous",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}.bg{fill:#14120f}.bar{fill:#26231f}.t{fill:#f2efe8}.p{fill:#7367eb}.o{fill:#a19d94}.ok{fill:#1fbfa8}.c{fill:#e9a84f}.l{opacity:0}@keyframes k0{0%,3.75%{opacity:0}4.55%,93%{opacity:1}98%,100%{opacity:0}}.l0{animation:k0 16.0s linear infinite}@keyframes k1{0%,9.38%{opacity:0}10.18%,93%{opacity:1}98%,100%{opacity:0}}.l1{animation:k1 16.0s linear infinite}@keyframes k2{0%,18.75%{opacity:0}19.55%,93%{opacity:1}98%,100%{opacity:0}}.l2{animation:k2 16.0s linear infinite}@keyframes k3{0%,24.38%{opacity:0}25.18%,93%{opacity:1}98%,100%{opacity:0}}.l3{animation:k3 16.0s linear infinite}@keyframes k4{0%,33.75%{opacity:0}34.55%,93%{opacity:1}98%,100%{opacity:0}}.l4{animation:k4 16.0s linear infinite}@keyframes k5{0%,39.38%{opacity:0}40.18%,93%{opacity:1}98%,100%{opacity:0}}.l5{animation:k5 16.0s linear infinite}@keyframes k6{0%,45.00%{opacity:0}45.80%,93%{opacity:1}98%,100%{opacity:0}}.l6{animation:k6 16.0s linear infinite}@keyframes k7{0%,54.38%{opacity:0}55.18%,93%{opacity:1}98%,100%{opacity:0}}.l7{animation:k7 16.0s linear infinite}@keyframes k8{0%,60.00%{opacity:0}60.80%,93%{opacity:1}98%,100%{opacity:0}}.l8{animation:k8 16.0s linear infinite}@media (prefers-reduced-motion:reduce){.l{animation:none!important;opacity:1}}</style><rect class="bg" width="760" height="262" rx="12"/><rect class="bar" width="760" height="32" rx="12"/><rect class="bar" y="16" width="760" height="16"/><circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/><text x="380.0" y="20" text-anchor="middle" class="o" style="font-size:12px">本地运行（网页版，只监听本机）</text><g class="l l0"><text x="20" y="60" class="c"># 下载源码（或在 Releases 下载 zip）</text></g><g class="l l1"><text x="20" y="82"><tspan class="p">$ </tspan><tspan class="t">git clone https://github.com/C0curicStudio/Hugluno.git &amp;&amp; cd Hugluno</tspan></text></g><g class="l l2"><text x="20" y="104" class="c"># 先审查：没有计划外的联网代码</text></g><g class="l l3"><text x="20" y="126"><tspan class="p">$ </tspan><tspan class="t">node tools/audit.mjs</tspan></text></g><g class="l l4"><text x="20" y="148" class="ok">✓ 全部通过：没有计划外的联网代码、没有外部资源、字体只用自有字体…</text></g><g class="l l5"><text x="20" y="170" class="c"># 启动（只监听 127.0.0.1，别的电脑连不上）</text></g><g class="l l6"><text x="20" y="192"><tspan class="p">$ </tspan><tspan class="t">node tools/serve.mjs</tspan></text></g><g class="l l7"><text x="20" y="214" class="o">Hugluno 快照版  →  http://127.0.0.1:8080/</text></g><g class="l l8"><text x="20" y="236" class="o">浏览器打开上面的地址，到「设置」填模型接口和密钥</text></g></svg>