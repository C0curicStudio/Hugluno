the zip from Releases)</text></g><g class="l l1"><text x="20" y="82"><tspan class="p">$ </tspan><tspan class="t">git clone https://github.com/C0curicStudio/Hugluno.git &amp;&amp; cd Hugluno</tspan></text></g><g class="l l2"><text x="20" y="104" class="c"># Audit first: no unplanned network code</text></g><g class="l l3"><text x="20" y="126"><tspan class="p">$ </tspan><tspan class="t">node tools/audit.mjs</tspan></text></g><g class="l l4"><text x="20" y="148" class="ok">✓ All checks passed: no unplanned network code, no external resources, own fonts only…</text></g><g class="l l5"><text x="20" y="170" class="c"># Start (listens on 127.0.0.1 only — other computers cannot connect)</text></g><g class="l l6"><text x="20" y="192"><tspan class="p">$ </tspan><tspan class="t">node tools/serve.mjs</tspan></text></g><g class="l l7"><text x="20" y="214" class="o">Hugluno Snapshot  →  http://127.0.0.1:8080/</text></g><g class="l l8"><text x="20" y="236" class="o">Open that address in your browser, then enter a model URL and key in Settings</text></g></svg>