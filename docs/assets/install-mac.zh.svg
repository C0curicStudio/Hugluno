<svg width="740" height="280" viewBox="0 0 740 280" role="img" aria-label="Mac 安装：第一次打开会被拦住" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif}.bg{fill:#fffdf9}.bg2{fill:#f1ede4}.t{fill:#1f1d1a}.m{fill:#7a766c}.a{fill:#4A3FC4}.w{fill:#fff}.acc{fill:#5B4FE0}.accs{fill:#E7E4FB}.mu{fill:#a39e92}.hl{fill:none;stroke:#5B4FE0;stroke-width:2;stroke-dasharray:5 4}.ar{stroke:#5B4FE0;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}@media(prefers-color-scheme:dark){.bg{fill:#26231f}.bg2{fill:#1b1916}.t{fill:#f2efe8}.m{fill:#a8a398}.a{fill:#8B82F2}.accs{fill:#4a2e24}.mu{fill:#6f6a60}}</style><rect class="bg2" x="10" y="0" width="220" height="214" rx="16"/><text class="a" x="24" y="28" font-size="13.5" font-weight="700" text-anchor="start">① 拖进「应用程序」</text><rect class="bg" x="20" y="40" width="200" height="164" rx="12"/><text class="t" x="32" y="66" font-size="12.5" font-weight="700" text-anchor="start">Hugluno-Snapshot.dmg</text><text class="m" x="32" y="88" font-size="11.5" font-weight="400" text-anchor="start">把 Hugluno 图标拖到</text><text class="m" x="32" y="106" font-size="11.5" font-weight="400" text-anchor="start">「应用程序」文件夹</text><path class="ar" d="M232 107H241"/><path class="ar" d="M236 102L242 107L236 112"/><rect class="bg2" x="250" y="0" width="220" height="214" rx="16"/><text class="a" x="264" y="28" font-size="13.5" font-weight="700" text-anchor="start">② 第一次打开被拦</text><rect class="bg" x="260" y="40" width="200" height="164" rx="12"/><text class="t" x="272" y="66" font-size="12.5" font-weight="700" text-anchor="start">无法打开「Hugluno Snapshot」</text><text class="m" x="272" y="88" font-size="11.5" font-weight="400" text-anchor="start">无法验证开发者，</text><text class="m" x="272" y="106" font-size="11.5" font-weight="400" text-anchor="start">不能确认没有恶意软件</text><rect class="accs" x="272" y="126" width="176" height="28" rx="14"/><text class="a" x="360" y="145" font-size="12" font-weight="700" text-anchor="middle">好</text><rect class="hl" x="270" y="124" width="180" height="32" rx="16"/><rect class="bg2" x="272" y="160" width="176" height="28" rx="14"/><text class="m" x="360" y="179" font-size="12" font-weight="400" text-anchor="middle">移到废纸篓</text><path class="ar" d="M472 107H481"/><path class="ar" d="M476 102L482 107L476 112"/><rect class="bg2" x="490" y="0" width="220" height="214" rx="16"/><text class="a" x="504" y="28" font-size="13.5" font-weight="700" text-anchor="start">③ 去系统设置放行</text><rect class="bg" x="500" y="40" width="200" height="164" rx="12"/><text class="t" x="512" y="66" font-size="12.5" font-weight="700" text-anchor="start">隐私与安全性</text><text class="m" x="512" y="88" font-size="11.5" font-weight="400" text-anchor="start">已阻止使用「Hugluno Snapshot」</text><rect class="accs" x="512" y="126" width="176" height="28" rx="14"/><text class="a" x="600" y="145" font-size="12" font-weight="700" text-anchor="middle">仍要打开</text><rect class="hl" x="510" y="124" width="180" height="32" rx="16"/><text class="m" x="360" y="240" font-size="12" font-weight="400" text-anchor="middle">这是 macOS 对非 App Store 软件的提示，放行需要输入开机密码。</text><text class="m" x="360" y="260" font-size="12" font-weight="400" text-anchor="middle">不放心就不要放行，直接把 Hugluno 拖进废纸篓。</text></svg>
