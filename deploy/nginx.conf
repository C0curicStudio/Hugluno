# Hugluno Snapshot — nginx（自有服务器 / VPS）。把 hugluno-snapshot-web 解压到 /var/www/hugluno，然后：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/hugluno.conf && sudo nginx -t && sudo systemctl reload nginx
# 先用 certbot 或你的面板申请好证书（浏览器的 Web Crypto / IndexedDB 在 https 或 localhost 下才完整可用）。
server {
  listen 443 ssl http2;
  server_name hugluno.example.com;                       # ← 改成你的域名
  ssl_certificate     /etc/letsencrypt/live/hugluno.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hugluno.example.com/privkey.pem;

  root /var/www/hugluno;
  index index.html;
  autoindex off;
  server_tokens off;
  access_log off;                                         # 不记访问日志：这个站不需要知道谁来过

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;         # 学习窗口 lab.html 要被自己的页面嵌入
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; }
  location /fonts/ {                                       # 学习窗口（不透明来源）要跨域读取字体
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # 想让整站只能用你自己的密码访问：取消下面两行注释（htpasswd -c /etc/nginx/.htpasswd 用户名）
  # auth_basic "Hugluno"; auth_basic_user_file /etc/nginx/.htpasswd;
}
server { listen 80; server_name hugluno.example.com; return 301 https://$host$request_uri; }
