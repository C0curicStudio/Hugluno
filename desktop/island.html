<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
@font-face{font-family:"MaxRIous";font-weight:100 900;src:url(../app/fonts/maxrious-400.woff2) format("woff2")}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:500 13px/1.4 "MaxRIous",sans-serif;-webkit-user-select:none;user-select:none}
.wrap{height:100%;display:flex;justify-content:center;align-items:flex-start;padding-top:6px}
#i{background:#141210;color:#f2efe8;border-radius:999px;box-shadow:0 6px 24px -8px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;overflow:hidden;
  width:36px;height:10px;transition:width .42s cubic-bezier(.22,1,.36,1),height .42s cubic-bezier(.22,1,.36,1),box-shadow .4s}
#i.pill{width:150px;height:30px;padding:0 12px;cursor:pointer}
#i.input{width:340px;height:42px;padding:0 14px;cursor:text}
#i.pending{box-shadow:0 0 0 1px rgba(115,103,235,.5),0 0 18px 2px rgba(115,103,235,.45);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(115,103,235,.25),0 0 8px 0 rgba(115,103,235,.2)}}
.d{width:6px;height:6px;border-radius:50%;background:#7367EB;flex:none;opacity:0;transition:opacity .3s}
#i.pill .d,#i.input .d{opacity:1}
.t{white-space:nowrap;opacity:0;transition:opacity .25s;color:#a19d94}#i.pill .t{opacity:1}
input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#f2efe8;font:inherit;font-size:14px;display:none}
#i.input input{display:block}#i.input .t{display:none}
#i.hint{width:300px;height:30px;padding:0 12px;cursor:pointer;box-shadow:0 0 0 1px rgba(240,164,58,.6),0 0 16px 2px rgba(240,164,58,.45)}#i.hint .d{opacity:1;background:#f0a43a}#i.hint .t{opacity:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body><div class="wrap"><div id="i"><span class="d"></span><span class="t" id="t">Lunosland</span><input id="q" placeholder="…" spellcheck="false"></div></div>
<script>
var I=document.getElementById('i'),Q=document.getElementById('q'),TX=document.getElementById('t'),S={mode:'dot',pending:false,hint:''};
function paint(){I.className=(S.hint&&S.mode!=='input'?'hint':S.mode==='input'?'input':S.mode==='pill'?'pill':'')+(S.pending?' pending':'');TX.textContent=S.hint||'Lunosland'}
I.addEventListener('mouseenter',function(){Island.hover(true);if(S.mode==='dot'){S.mode='pill';paint()}});
I.addEventListener('mouseleave',function(){if(S.mode!=='input'){Island.hover(false);S.mode='dot';paint()}});
I.addEventListener('click',function(){if(S.hint&&S.mode!=='input'){Island.openHint();S.hint='';S.mode='dot';paint();Island.hover(false);return}if(S.mode!=='input'){S.mode='input';paint();Island.expand(true);setTimeout(function(){Q.focus()},60)}});
Q.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.isComposing&&Q.value.trim()){Island.submit(Q.value.trim());Q.value='';S.mode='dot';S.pending=true;paint();Island.expand(false);Island.hover(false)}
  else if(e.key==='Escape'){Q.value='';S.mode='dot';paint();Island.expand(false);Island.hover(false)}});
Q.addEventListener('blur',function(){if(S.mode==='input'&&!Q.value){S.mode='dot';paint();Island.expand(false);Island.hover(false)}});
Island.onState(function(s){Object.assign(S,s||{});paint()});paint();
</script></body></html>
